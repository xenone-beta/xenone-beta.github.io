<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Каталог каналов</title>
<meta name="theme-color" content="#151b21">

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  /* =========================================================
     Токены оформления (стиль BotFather Mini App)
     ========================================================= */
  :root,
  :root[data-theme="dark"] {
    --bg:        #151b21;
    --card:      #1e262e;
    --field:     #1e262e;
    --divider:   #2a343e;
    --text:      #ffffff;
    --hint:      #8b97a3;
    --accent:    #3d9ae8;
    --accent-bg: rgba(61,154,232,.16);
    --press:     rgba(255,255,255,.07);
  }
  :root[data-theme="light"] {
    --bg:        #eff2f5;
    --card:      #ffffff;
    --field:     #ffffff;
    --divider:   #e4e8ec;
    --text:      #0e1317;
    --hint:      #6c7883;
    --accent:    #2a8bd8;
    --accent-bg: rgba(42,139,216,.12);
    --press:     rgba(0,0,0,.06);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .25s ease, color .25s ease;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px calc(32px + env(safe-area-inset-bottom));
  }

  svg { display: block; flex-shrink: 0; }

  /* =========================================================
     Шапка
     ========================================================= */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }

  .hero-avatar {
    position: relative;
    width: 96px; height: 96px;
    border-radius: 50%;
    overflow: hidden;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #4aa8f0, #2b6fd0);
    color: #fff; font-size: 40px; font-weight: 600;
  }
  .hero-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }

  .hero h1 {
    margin: 18px 0 0;
    font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -.3px;
  }

  .hero p {
    margin: 10px 0 0;
    max-width: 34ch;
    font-size: 17px; line-height: 23px;
    color: var(--hint);
  }
  .hero p a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
  }

  /* =========================================================
     Поиск
     ========================================================= */
  .search {
    margin-top: 28px;
    height: 48px;
    padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
    background: var(--field);
    border-radius: 16px;
    color: var(--hint);
  }
  .search svg { width: 22px; height: 22px; }
  .search input {
    flex: 1; min-width: 0;
    height: 100%;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 17px;
    color: var(--text);
  }
  .search input::placeholder { color: var(--hint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear {
    display: none;
    width: 28px; height: 28px; border: 0; padding: 0;
    border-radius: 50%; background: var(--press); color: var(--hint);
    place-items: center; cursor: pointer;
  }
  .search.has-text .clear { display: grid; }
  .search .clear svg { width: 14px; height: 14px; }

  /* =========================================================
     Фильтр по типу
     ========================================================= */
  .chips {
    display: flex; gap: 8px;
    margin: 16px -16px 0;
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    height: 34px; padding: 0 16px;
    border: 0; border-radius: 17px;
    background: var(--card); color: var(--hint);
    font: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer;
    transition: background-color .2s ease, color .2s ease;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* =========================================================
     Секции и строки
     ========================================================= */
  .section-title {
    display: flex; align-items: baseline; gap: 8px;
    margin: 28px 4px 12px;
    font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -.2px;
  }
  .section-title small {
    font-size: 15px; font-weight: 500; color: var(--hint);
  }

  .list {
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
  }

  .row {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    min-height: 72px;
    padding: 12px 8px 12px 16px;
    cursor: pointer;
    outline: none;
    transition: background-color .15s ease;
    animation: row-in .35s cubic-bezier(.2,0,0,1) both;
  }
  .row + .row::before {
    content: '';
    position: absolute; top: 0; right: 0; left: 78px;
    height: 1px; background: var(--divider);
  }
  .row:active, .row:focus-visible { background: var(--press); }
  @media (hover: hover) { .row:hover { background: var(--press); } }

  @keyframes row-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .row-avatar {
    position: relative;
    width: 48px; height: 48px;
    border-radius: 50%;
    overflow: hidden;
    display: grid; place-items: center;
    color: #fff; font-size: 21px; font-weight: 600;
    flex-shrink: 0;
  }
  .row-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }

  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-size: 17px; line-height: 22px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-sub {
    margin-top: 2px;
    font-size: 15px; line-height: 20px; color: var(--hint);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .row-actions { display: flex; align-items: center; flex-shrink: 0; }

  .icon-btn {
    width: 40px; height: 40px;
    border: 0; padding: 0; border-radius: 50%;
    background: transparent; color: var(--hint);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease, transform .15s ease;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn:active { background: var(--press); transform: scale(.92); }
  .icon-btn.fav-on { color: #f5b73b; }

  .chev { width: 24px; height: 24px; color: var(--hint); opacity: .7; margin-right: 4px; }

  /* Строка действия («Предложить канал») */
  .row.action { min-height: 64px; }
  .row.action .row-title { color: var(--accent); font-weight: 500; }
  .action-icon { width: 48px; height: 48px; display: grid; place-items: center; color: var(--accent); }
  .action-icon svg { width: 44px; height: 44px; }
  .row.action + .row::before { left: 78px; }

  .empty {
    margin-top: 40px; text-align: center; color: var(--hint);
    font-size: 17px; line-height: 24px;
  }
  .empty svg { width: 48px; height: 48px; margin: 0 auto 12px; opacity: .6; }

  .footer {
    margin-top: 32px; text-align: center;
    font-size: 13px; color: var(--hint); opacity: .8;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>

<body>
<div class="app">

  <header class="hero">
    <!-- АВАТАРКА: положи icon.png рядом с index.html. Нет файла — покажется буква. -->
    <div class="hero-avatar" id="heroAvatar">
      <span id="heroInitial"></span>
      <img src="icon.png" alt="" id="heroImg">
    </div>
    <h1 id="title"></h1>
    <p><span id="desc"></span> <a id="learnMore" role="link" tabindex="0"></a></p>
  </header>

  <label class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" placeholder="Поиск" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Поиск">
    <button class="clear" id="clear" type="button" aria-label="Очистить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </label>

  <div class="chips" id="chips" role="group" aria-label="Тип"></div>

  <main id="content"></main>

  <div class="footer" id="footer"></div>
</div>

<script>
/* =============================================================
   НАСТРОЙКИ — меняй здесь
   ============================================================= */
const CONFIG = {
  title: 'Каталог каналов',
  description: 'Подборка полезных Telegram-каналов, групп и ботов.',
  learnMoreText: 'Подробнее',
  learnMoreUrl: 'https://t.me/atestnews',        // TODO: ссылка «Подробнее» (свой канал / пост)
  suggestText: 'Предложить канал',
  suggestUrl: 'https://t.me/oystrix',          // TODO: твой юзернейм, куда писать предложения
  shareText: 'Поделиться каталогом',
  shareUrl: 'https://t.me/BotApp',          // TODO: ссылка на твоего бота / приложение
  shareMessage: 'Подборка полезных Telegram-каналов',
  footer: ''                                    // например: '© xenone-beta'
};

/* =============================================================
   КАТАЛОГ — добавляй свои каналы сюда
   -------------------------------------------------------------
   name     — название
   handle   — юзернейм без @  (или вместо него url: 'https://t.me/+инвайт')
   desc     — короткое описание
   category — раздел (секции создаются автоматически)
   type     — 'channel' | 'group' | 'bot'
   icon     — (необязательно) путь к картинке, например 'img/news.png'
   ============================================================= */
const CHANNELS = [
  { name: 'ATestNews',  handle: 'atestnews',    desc: 'Some news',   category: 'Telegram', type: 'channel' },
  { name: 'Cloudly Hosting',    handle: 'CloudlyHost',       desc: 'Python Hosting',                    category: 'Telegram', type: 'channel' },
  { name: '[T] Room',  handle: 'savetest_vf',desc: 'Good channel with good news',     category: 'Telegram', type: 'channel' },
  { name: 'Bot News',       handle: 'ABotNews',     desc: 'Something about bots',          category: 'Разработка', type: 'channel' },
  { name: 'Bot Talk',       handle: 'BotTalk',     desc: 'Chat About bots developing',                  category: 'Разработка', type: 'group' },
  { name: 'BotApp',       handle: 'BotApp',     desc: 'This Bot',                  category: 'Разработка', type: 'Bot' }

  /* Шаблон для нового канала:
  { name: 'Название', handle: 'username', desc: 'О чём канал', category: 'Раздел', type: 'channel' },
  */
];

/* =============================================================
   Код приложения
   ============================================================= */
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const TYPE_LABEL = { channel: 'Канал', group: 'Группа', bot: 'Бот' };
  const FILTERS = [
    { id: 'all', label: 'Все' },
    { id: 'channel', label: 'Каналы' },
    { id: 'group', label: 'Группы' },
    { id: 'bot', label: 'Боты' }
  ];

  const $ = (id) => document.getElementById(id);
  const state = { q: '', type: 'all', favs: new Set() };

  const SVG = {
    chevron: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg>',
    starOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg>',
    plus: '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="22" cy="22" r="17"/><path d="M22 14v16M14 22h16"/></svg>',
    share: '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="22" cy="22" r="17"/><path d="M22 28V14m0 0-6 6m6-6 6 6"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 11h5"/></svg>'
  };

  /* ---------- Тема (из Telegram или системная) ---------- */
  function applyTheme() {
    let scheme = 'dark';
    if (tg && tg.colorScheme) scheme = tg.colorScheme;
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) scheme = 'light';
    document.documentElement.setAttribute('data-theme', scheme);
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    try {
      if (tg) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
    } catch (e) {}
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', bg);
  }

  /* ---------- Ссылки ---------- */
  function linkOf(item) { return item.url || ('https://t.me/' + String(item.handle || '').replace(/^@/, '')); }

  function openLink(url) {
    try {
      if (tg && /^https:\/\/t\.me\//i.test(url) && tg.openTelegramLink) { tg.openTelegramLink(url); return; }
      if (tg && tg.openLink) { tg.openLink(url); return; }
    } catch (e) {}
    window.open(url, '_blank', 'noopener');
  }

  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'select') tg.HapticFeedback.selectionChanged();
      else tg.HapticFeedback.impactOccurred('light');
    } catch (e) {}
  }

  /* ---------- Избранное: CloudStorage Telegram + localStorage ---------- */
  function saveFavs() {
    const json = JSON.stringify(Array.from(state.favs));
    try { localStorage.setItem('favs', json); } catch (e) {}
    try { if (tg && tg.CloudStorage && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem('favs', json); } catch (e) {}
  }

  function loadFavs() {
    function apply(json) {
      try {
        const arr = JSON.parse(json || '[]');
        if (Array.isArray(arr)) arr.forEach((k) => state.favs.add(k));
      } catch (e) {}
    }
    try { apply(localStorage.getItem('favs')); } catch (e) {}
    render();
    try {
      if (tg && tg.CloudStorage && tg.isVersionAtLeast('6.9')) {
        tg.CloudStorage.getItem('favs', function (err, val) {
          if (!err && val) { apply(val); render(); }
        });
      }
    } catch (e) {}
  }

  /* ---------- Аватарки ---------- */
  const GRADIENTS = [
    ['#f7971e', '#e65c00'], ['#43c6ac', '#1d8a77'], ['#8e6cf0', '#5a3fc0'],
    ['#f2709c', '#d1356b'], ['#4aa8f0', '#2b6fd0'], ['#6dd35f', '#35a02b'], ['#f5b73b', '#d98a0b']
  ];
  function gradientFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    const g = GRADIENTS[h % GRADIENTS.length];
    return 'linear-gradient(135deg,' + g[0] + ',' + g[1] + ')';
  }

  function makeAvatar(item) {
    const av = document.createElement('div');
    av.className = 'row-avatar';
    av.style.background = gradientFor(item.name);
    const letter = document.createElement('span');
    letter.textContent = (item.name.trim()[0] || '?').toUpperCase();
    av.appendChild(letter);
    if (item.icon) {
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = item.icon;
      img.addEventListener('load', () => { letter.style.display = 'none'; });
      img.addEventListener('error', () => img.remove());
      av.appendChild(img);
    }
    return av;
  }

  /* ---------- Строки ---------- */
  function keyOf(item) { return item.handle || item.url || item.name; }

  function makeRow(item, delay) {
    const row = document.createElement('div');
    row.className = 'row';
    row.tabIndex = 0;
    row.setAttribute('role', 'link');
    row.style.animationDelay = Math.min(delay * 25, 250) + 'ms';

    row.appendChild(makeAvatar(item));

    const body = document.createElement('div');
    body.className = 'row-body';
    const t = document.createElement('div');
    t.className = 'row-title';
    t.textContent = item.name;
    const s = document.createElement('div');
    s.className = 'row-sub';
    s.textContent = (TYPE_LABEL[item.type] || 'Канал') + (item.desc ? ' · ' + item.desc : '');
    body.append(t, s);
    row.appendChild(body);

    const actions = document.createElement('div');
    actions.className = 'row-actions';
    const fav = document.createElement('button');
    fav.type = 'button';
    const isFav = state.favs.has(keyOf(item));
    fav.className = 'icon-btn' + (isFav ? ' fav-on' : '');
    fav.setAttribute('aria-label', isFav ? 'Убрать из избранного' : 'В избранное');
    fav.innerHTML = isFav ? SVG.starOn : SVG.star;
    fav.addEventListener('click', (e) => {
      e.stopPropagation();
      const k = keyOf(item);
      if (state.favs.has(k)) state.favs.delete(k); else state.favs.add(k);
      haptic('select');
      saveFavs();
      render();
    });
    actions.appendChild(fav);
    actions.insertAdjacentHTML('beforeend', SVG.chevron);
    row.appendChild(actions);

    const go = () => { haptic(); openLink(linkOf(item)); };
    row.addEventListener('click', go);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    return row;
  }

  function makeActionRow(icon, text, onClick) {
    const row = document.createElement('div');
    row.className = 'row action';
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    const ic = document.createElement('div');
    ic.className = 'action-icon';
    ic.innerHTML = icon;
    const body = document.createElement('div');
    body.className = 'row-body';
    const t = document.createElement('div');
    t.className = 'row-title';
    t.textContent = text;
    body.appendChild(t);
    row.append(ic, body);
    row.addEventListener('click', () => { haptic(); onClick(); });
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter') onClick(); });
    return row;
  }

  function makeSection(title, count, rows) {
    const frag = document.createDocumentFragment();
    const h = document.createElement('h2');
    h.className = 'section-title';
    h.textContent = title + ' ';
    const small = document.createElement('small');
    small.textContent = count;
    h.appendChild(small);
    const list = document.createElement('div');
    list.className = 'list';
    rows.forEach((r) => list.appendChild(r));
    frag.append(h, list);
    return frag;
  }

  /* ---------- Рендер ---------- */
  function matches(item) {
    if (state.type !== 'all' && item.type !== state.type) return false;
    if (!state.q) return true;
    const hay = [item.name, item.handle, item.desc, item.category, TYPE_LABEL[item.type]].join(' ').toLowerCase();
    return hay.includes(state.q);
  }

  function render() {
    const root = $('content');
    root.textContent = '';
    const items = CHANNELS.filter(matches);
    let i = 0;

    // Избранное
    const favItems = items.filter((it) => state.favs.has(keyOf(it)));
    if (favItems.length) {
      root.appendChild(makeSection('Избранное', favItems.length, favItems.map((it) => makeRow(it, i++))));
    }

    // Действия (только без поиска)
    if (!state.q && state.type === 'all') {
      const actions = [makeActionRow(SVG.plus, CONFIG.suggestText, () => openLink(CONFIG.suggestUrl))];
      if (CONFIG.shareUrl) {
        actions.push(makeActionRow(SVG.share, CONFIG.shareText, () => {
          const url = 'https://t.me/share/url?url=' + encodeURIComponent(CONFIG.shareUrl) + '&text=' + encodeURIComponent(CONFIG.shareMessage);
          openLink(url);
        }));
      }
      const list = document.createElement('div');
      list.className = 'list';
      list.style.marginTop = '28px';
      actions.forEach((a) => list.appendChild(a));
      root.appendChild(list);
    }

    // Категории (порядок — по первому появлению в каталоге)
    const order = [];
    const groups = {};
    items.forEach((it) => {
      const c = it.category || 'Прочее';
      if (!groups[c]) { groups[c] = []; order.push(c); }
      groups[c].push(it);
    });
    order.forEach((c) => {
      root.appendChild(makeSection(c, groups[c].length, groups[c].map((it) => makeRow(it, i++))));
    });

    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = SVG.empty;
      e.appendChild(document.createTextNode('Ничего не найдено'));
      root.appendChild(e);
    }
  }

  function renderChips() {
    const box = $('chips');
    box.textContent = '';
    FILTERS.forEach((f) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = f.label;
      b.setAttribute('aria-pressed', String(state.type === f.id));
      b.addEventListener('click', () => {
        state.type = f.id;
        haptic('select');
        renderChips();
        render();
      });
      box.appendChild(b);
    });
  }

  /* ---------- Инициализация ---------- */
  function init() {
    document.title = CONFIG.title;
    $('title').textContent = CONFIG.title;
    $('desc').textContent = CONFIG.description;
    $('heroInitial').textContent = (CONFIG.title.trim()[0] || 'K').toUpperCase();
    $('footer').textContent = CONFIG.footer;

    const lm = $('learnMore');
    lm.textContent = CONFIG.learnMoreText + ' ›';
    lm.addEventListener('click', () => openLink(CONFIG.learnMoreUrl));
    lm.addEventListener('keydown', (e) => { if (e.key === 'Enter') openLink(CONFIG.learnMoreUrl); });

    const img = $('heroImg');
    img.addEventListener('error', () => img.remove());
    img.addEventListener('load', () => { $('heroInitial').style.display = 'none'; });
    if (img.complete && img.naturalWidth > 0) $('heroInitial').style.display = 'none';

    const q = $('q');
    q.addEventListener('input', () => {
      state.q = q.value.trim().toLowerCase();
      $('searchBox').classList.toggle('has-text', !!q.value);
      render();
    });
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') q.blur(); });
    $('clear').addEventListener('click', (e) => {
      e.preventDefault();
      q.value = ''; state.q = '';
      $('searchBox').classList.remove('has-text');
      render(); q.focus();
    });

    if (tg) {
      try { tg.ready(); tg.expand(); tg.onEvent('themeChanged', applyTheme); } catch (e) {}
    }
    applyTheme();
    renderChips();
    loadFavs();
  }

  init();
})();
</script>
</body>
</html>
